name: Feature request
description: Suggest a language, standard-library or tooling feature.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem you want solved, with a short example if possible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use today
